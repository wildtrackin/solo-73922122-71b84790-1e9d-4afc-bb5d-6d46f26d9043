services:
  demux:
    build: .
    image: paired-end-demux:latest
    ports:
      - "${DEMUX_PORT:-8000}:8000"
    environment:
      DEMUX_TMP_ROOT: /tmp/demux
      LOG_LEVEL: INFO
    restart: unless-stopped
    init: true
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

services:
  demux:
    build: .
    image: paired-end-demux:latest
    ports:
      - "${DEMUX_PORT:-8000}:8000"
    environment:
      DEMUX_TMP_ROOT: /tmp/demux
      LOG_LEVEL: INFO
      # Per-process capacity. Keep the API at one uvicorn worker: these limits
      # describe the whole service, not each worker.
      DEMUX_MAX_INFLIGHT: ${DEMUX_MAX_INFLIGHT:-2}
      DEMUX_TMP_BUDGET_BYTES: ${DEMUX_TMP_BUDGET_BYTES:-268435456}
    restart: unless-stopped
    init: true
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
